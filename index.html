<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Top YouTube Shorts</title><meta name="description" content="The most-viewed Shorts, playing now.">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}main{position:fixed;inset:0;background:#000;touch-action:none;overscroll-behavior:none;user-select:none}.stage{position:absolute;inset:0;display:grid;place-items:center}.player{height:100dvh;width:min(100vw,calc(100dvh * 9 / 16));max-width:100%;background:#000}.player iframe{width:100%;height:100%;border:0}.status,.empty{position:absolute;inset:0;border:0;background:#000;color:#999;display:grid;place-items:center;padding:28px;text-align:center;font-size:.76rem;text-transform:uppercase;letter-spacing:.1em}.empty{cursor:pointer}.off{display:none!important}.notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 15px;border-radius:999px;background:#f5f5f5eb;color:#050505;font-size:.78rem;font-weight:700;pointer-events:none}.saved-mark{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:#0009;backdrop-filter:blur(10px);font-size:.62rem;text-transform:uppercase;letter-spacing:.14em}.search{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),560px);display:grid;grid-template-columns:1fr auto;background:#121212e8;border:1px solid #ffffff33;border-radius:999px;padding:5px;backdrop-filter:blur(18px)}.search input{min-width:0;height:46px;border:0;outline:0;background:transparent;color:#fff;padding:0 14px;user-select:text}.search button{height:46px;min-width:52px;border:0;border-radius:999px;background:#fff;color:#000;font-weight:700}dialog{width:min(430px,calc(100% - 28px));border:1px solid #333;border-radius:16px;background:#151515;color:#fff;padding:0;box-shadow:0 24px 80px #000}dialog::backdrop{background:#000c;backdrop-filter:blur(7px)}.key-form{padding:24px;display:grid;gap:15px}.key-form h1{font-size:1.2rem;margin:0}.key-form p{font-size:.82rem;color:#aaa;line-height:1.5;margin:0}.key-form a{color:#fff}.key-form input{height:48px;border:1px solid #444;border-radius:9px;background:#090909;color:#fff;padding:0 12px;user-select:text}.key-form button{height:48px;border:0;border-radius:9px;background:#fff;color:#000;font-weight:700}.key-form button:disabled{opacity:.5}.key-error{color:#ff7064!important}</style>
<style>.player{position:relative;z-index:1;will-change:transform}.player iframe{pointer-events:none}.peek{position:absolute;z-index:0;height:100dvh;width:min(100vw,calc(100dvh * 9 / 16));max-width:100%;inset:0;margin:auto;background:#050505 center/cover no-repeat;will-change:transform}.previous-peek{transform:translateY(calc(-100% + 8px))}.next-peek{transform:translateY(calc(100% - 8px))}.peek:after{content:"";position:absolute;inset:0;background:linear-gradient(#0002,#0000 60%,#0005)}.loading-cover{position:absolute;z-index:2;height:100dvh;width:min(100vw,calc(100dvh * 9 / 16));max-width:100%;inset:0;margin:auto;background:#050505 center/cover no-repeat;opacity:0;pointer-events:none;will-change:transform;transition:opacity .16s ease}.loading-cover.visible{opacity:1}.gesture{position:absolute;inset:0;z-index:3;touch-action:none}.swipe-label{position:absolute;top:50%;z-index:4;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transform:translateY(-50%) scale(.82);font-size:2.15rem;font-weight:800;line-height:1;opacity:0;pointer-events:none;box-shadow:0 10px 30px #0008;transition:opacity .08s,transform .08s}.save-label{right:max(20px,env(safe-area-inset-right));background:#62e68d;color:#05210e}.delete-label{left:max(20px,env(safe-area-inset-left));background:#ff5d57;color:#fff}.notice,.saved-mark{z-index:4}.status,.empty{z-index:5}.search{z-index:4;bottom:clamp(72px,11dvh,118px);width:min(calc(100% - 48px),440px);padding:4px;background:#161616c9;border-color:#ffffff26;box-shadow:0 14px 44px #0009;transition:opacity .18s ease,transform .18s ease}.search input{height:42px;padding-left:16px;font-size:.92rem}.search button{height:42px;min-width:42px;width:42px;font-size:1.05rem}</style><script type="module" crossorigin src="./assets/app-v18.js"></script><script src="https://www.youtube.com/iframe_api"></script></head>
<body><main><section class="stage" id="stage"><div class="player" id="player"></div><div class="status" id="status">Finding Shorts</div><button class="empty off" id="empty">YouTube unavailable · tap to change key</button><div class="notice off" id="notice"></div><div class="saved-mark off" id="savedMark">Saved</div></section><form class="search off" id="search"><input id="query" aria-label="Search Shorts" placeholder="Search Shorts" autocomplete="off"><button type="submit" aria-label="Search">Go</button></form></main>
<dialog id="keyModal"><form class="key-form" id="keyForm"><h1>Connect YouTube</h1><p>This app uses your own YouTube Data API key. It stays in this browser and is sent only to Google’s YouTube API.</p><a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noreferrer">Create an API key in Google Cloud ↗</a><p>Enable <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noreferrer">YouTube Data API v3</a>, then restrict the key to that API and to <strong>https://kakkoidev.github.io/*</strong>.</p><input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste API key" aria-label="YouTube API key" required><p class="key-error" id="keyError"></p><button id="keySubmit" type="submit">Continue</button></form></dialog></body></html>
