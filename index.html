<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Top YouTube Shorts</title><meta name="description" content="The most-viewed Shorts, playing now.">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}main{position:fixed;inset:0;background:#000;touch-action:none;overscroll-behavior:none;user-select:none}.stage{position:absolute;inset:0;display:grid;place-items:center}.player{height:100dvh;width:min(100vw,calc(100dvh * 9 / 16));max-width:100%;background:#000}.player iframe{width:100%;height:100%;border:0}.status,.empty{position:absolute;inset:0;border:0;background:#000;color:#999;display:grid;place-items:center;font-size:.76rem;text-transform:uppercase;letter-spacing:.1em}.empty{cursor:pointer}.off{display:none!important}.notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 15px;border-radius:999px;background:#f5f5f5eb;color:#050505;font-size:.78rem;font-weight:700;pointer-events:none}.saved-mark{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:#0009;backdrop-filter:blur(10px);font-size:.62rem;text-transform:uppercase;letter-spacing:.14em}.search{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),560px);display:grid;grid-template-columns:1fr auto;background:#121212e8;border:1px solid #ffffff33;border-radius:999px;padding:5px;backdrop-filter:blur(18px)}.search input{min-width:0;height:46px;border:0;outline:0;background:transparent;color:#fff;padding:0 14px;user-select:text}.search button{height:46px;min-width:52px;border:0;border-radius:999px;background:#fff;color:#000;font-weight:700}</style>
<script type="module" crossorigin src="./assets/app-v2.js"></script><script src="https://www.youtube.com/iframe_api"></script></head>
<body><main><section class="stage" id="stage"><div class="player" id="player"></div><div class="status" id="status">Finding Shorts</div><button class="empty off" id="empty">YouTube unavailable · tap to retry</button><div class="notice off" id="notice"></div><div class="saved-mark off" id="savedMark">Saved</div></section><form class="search off" id="search"><input id="query" aria-label="Search Shorts" placeholder="Search Shorts" autocomplete="off"><button type="submit" aria-label="Search">Go</button></form></main></body></html>
